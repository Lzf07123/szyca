name: szyca

services:
  quiz:
    image: "${QUIZ_IMAGE_REGISTRY:-}${QUIZ_IMAGE:-szyca:latest}"
    pull_policy: ${QUIZ_PULL_POLICY:-missing}
    environment:
      APP_PORT: "8081"
      DATABASE_URL: postgres://quiz:${POSTGRES_PASSWORD:-quiz}@127.0.0.1:5432/quiz?sslmode=disable
      REDIS_ADDR: 127.0.0.1:6379
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      QUESTION_SECONDS: ${QUESTION_SECONDS:-20}
      ANSWER_GRACE_SECONDS: ${ANSWER_GRACE_SECONDS:-20}
      QUESTION_COUNT: ${QUESTION_COUNT:-10}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
      UPLOAD_DIR: /data/uploads
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      POSTGRES_DB: quiz
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quiz}
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - quizdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  quizdata:
