name: szyca

services:
  szyca:
    container_name: szyca
    image: "${SZYCA_IMAGE_REGISTRY:-}${SZYCA_IMAGE:-szyca:latest}"
    pull_policy: ${SZYCA_PULL_POLICY:-missing}
    environment:
      APP_PORT: "8081"
      DATABASE_URL: postgres://szyca:${POSTGRES_PASSWORD:-szyca}@127.0.0.1:5432/szyca?sslmode=disable
      REDIS_ADDR: 127.0.0.1:6379
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-owner}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-8}
      LEGACY_ADMIN_TOKEN_ENABLED: ${LEGACY_ADMIN_TOKEN_ENABLED:-false}
      QUESTION_SECONDS: ${QUESTION_SECONDS:-20}
      ANSWER_GRACE_SECONDS: ${ANSWER_GRACE_SECONDS:-20}
      QUESTION_COUNT: ${QUESTION_COUNT:-10}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
      UPLOAD_DIR: /data/uploads
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      POSTGRES_DB: szyca
      POSTGRES_USER: szyca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-szyca}
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  data:
